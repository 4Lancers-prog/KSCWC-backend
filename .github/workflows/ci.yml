name: backend-ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: mongodb://127.0.0.1:27017/kscwc_ci?replicaSet=rs0
      TEST_DATABASE_URL: mongodb://127.0.0.1:27017/kscwc_test?replicaSet=rs0
      SESSION_SECRET: ci_session_secret_0123456789abcdef
      CSRF_SECRET: ci_csrf_secret_0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      # Wallet code uses transactions, which need a replica set (same as Atlas).
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }" && break
            sleep 2
          done
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && break
            sleep 2
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
