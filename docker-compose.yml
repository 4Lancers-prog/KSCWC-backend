# docker-compose.yml — local MongoDB (single-node replica set: transactions need one).
# Usage: `docker compose up -d`, then in .env:
#   DATABASE_URL=mongodb://127.0.0.1:27017/kscwc?replicaSet=rs0
#   TEST_DATABASE_URL=mongodb://127.0.0.1:27017/kscwc_test?replicaSet=rs0
services:
  mongo:
    image: mongo:8
    container_name: kscwc_mongo
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - kscwc_mongo:/data/db
    healthcheck:
      # initiates the replica set on first start, then reports healthy
      test: ['CMD', 'mongosh', '--quiet', '--eval', "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  kscwc_mongo:
